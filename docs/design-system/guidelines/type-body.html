<!-- @dsCard group="Type" viewport="700x180" name="Body — IBM Plex Sans" subtitle="UI and prose voice; precise and engineered" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); font-family: var(--font-sans); padding: 20px 26px; }
  .w { display: flex; gap: 28px; }
  .lead { color: var(--ink-100); font-size: 17px; line-height: 1.5; max-width: 380px; font-weight: 400; }
  .lead b { font-weight: 600; }
  .weights { font-family: var(--font-mono); color: var(--ink-300); font-size: 11px; line-height: 2; border-left: 1px solid var(--line-2); padding-left: 18px; }
  .weights span { color: var(--ink-100); }
</style>
</head>
<body>
  <div class="w">
    <p class="lead">USAP turns any LLM into an <b>auditable, portable security workflow runtime</b>. Agents reason, humans approve, the execution layer acts.</p>
    <div class="weights">
      <div style="font-weight:400;color:var(--ink-100)">Regular — 400 <span style="color:var(--ink-300)">body</span></div>
      <div style="font-weight:500;color:var(--ink-100)">Medium — 500 <span style="color:var(--ink-300)">UI labels</span></div>
      <div style="font-weight:600;color:var(--ink-100)">Semibold — 600 <span style="color:var(--ink-300)">emphasis</span></div>
      <div style="font-weight:700;color:var(--ink-100)">Bold — 700 <span style="color:var(--ink-300)">headings</span></div>
    </div>
  </div>
</body>
</html>
