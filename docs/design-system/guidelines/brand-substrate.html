<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); }
  .field { position: relative; height: 190px; background:
      var(--grad-hub),
      var(--texture-grid),
      var(--void);
    background-size: auto, var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size), auto;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hub { width: 78px; height: 88px; display: flex; align-items: center; justify-content: center;
    background: var(--surface-1); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    box-shadow: var(--glow-signal-soft); }
  .hub-inner { width: 70px; height: 80px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: var(--void); display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--cyan-400); color: var(--ink-50); font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .tag { position: absolute; bottom: 12px; left: 16px; font-family: var(--font-mono); color: var(--ink-300); font-size: 10px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="field">
    <div class="hub"><div class="hub-inner">USAP</div></div>
    <span class="tag">--texture-grid · --grad-hub · hexagonal node</span>
  </div>
</body>
</html>
