<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Major-third scale, Space Grotesk display over IBM Plex Sans body" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); padding: 18px 24px; }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line-faint); padding: 7px 0; }
  .line:last-child { border-bottom: 0; }
  .spec { font-family: var(--font-mono); color: var(--ink-300); font-size: 10px; width: 120px; flex: none; }
  .samp { color: var(--ink-100); font-family: var(--font-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="line"><span class="spec">3xl · 42 · display</span><span class="samp" style="font-size:42px;font-weight:700">Reason. Approve.</span></div>
  <div class="line"><span class="spec">2xl · 32 · display</span><span class="samp" style="font-size:32px;font-weight:600">Governed agentic security</span></div>
  <div class="line"><span class="spec">xl · 25 · display</span><span class="samp" style="font-size:25px;font-weight:600">Twelve orchestrator agents</span></div>
  <div class="line"><span class="spec">lg · 20 · sans</span><span class="samp" style="font-size:20px;font-weight:500;font-family:var(--font-sans)">Eleven-field output contract</span></div>
  <div class="line"><span class="spec">base · 15 · sans</span><span class="samp" style="font-size:15px;font-weight:400;font-family:var(--font-sans);color:var(--ink-200)">Every skill emits CVSS, MITRE technique IDs, and evidence references.</span></div>
  <div class="line"><span class="spec">xs · 12 · mono</span><span class="samp" style="font-size:12px;font-weight:400;font-family:var(--font-mono);color:var(--ink-300);letter-spacing:0.04em">human_approval_required: true</span></div>
</body>
</html>
