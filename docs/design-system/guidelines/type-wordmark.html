<!-- @dsCard group="Type" viewport="700x150" name="Wordmark & Display" subtitle="Space Grotesk Bold — the USAP wordmark voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-display);
         padding: 22px 28px; display: flex; align-items: center; gap: 36px; }
  .mark { font-weight: 700; font-size: 72px; letter-spacing: -0.02em; color: var(--ink-50);
          text-shadow: 0 0 22px rgba(41,211,240,0.0); }
  .mark b { color: var(--cyan-400); text-shadow: var(--glow-text); }
  .meta { font-family: var(--font-mono); }
  .meta .k { color: var(--cyan-400); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .meta .v { color: var(--ink-300); font-size: 11px; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="mark">USA<b>P</b></div>
  <div class="meta">
    <div class="k">Unified Security Agent Platform</div>
    <div class="v">Space Grotesk · 700 · tracking −0.02em<br>--font-display · --text-5xl (76px)</div>
  </div>
</body>
</html>
