<!-- @dsCard group="Type" viewport="700x190" name="Mono — IBM Plex Mono" subtitle="Telemetry, labels, code, designations — the clinical layer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-mono); padding: 18px 22px; }
  .caps { color: var(--cyan-400); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
  .code { background: var(--surface-1); border: 1px solid var(--line-1); border-radius: 6px; padding: 12px 14px; font-size: 12.5px; line-height: 1.7; }
  .k { color: var(--code-key); }
  .s { color: var(--code-string); }
  .n { color: var(--code-number); }
  .p { color: var(--code-punct); }
  .c { color: var(--code-comment); }
</style>
</head>
<body>
  <div class="caps">cs-appsec-engineer · designation</div>
  <div class="code">
    <span class="c"># 11-field output contract</span><br>
    <span class="p">{ </span><span class="k">"agent_slug"</span><span class="p">: </span><span class="s">"vuln-scan"</span><span class="p">, </span><span class="k">"severity"</span><span class="p">: </span><span class="s">"high"</span><span class="p">,</span><br>
    &nbsp;&nbsp;<span class="k">"confidence"</span><span class="p">: </span><span class="n">0.82</span><span class="p">, </span><span class="k">"human_approval_required"</span><span class="p">: </span><span class="n">false</span><span class="p"> }</span>
  </div>
</body>
</html>
