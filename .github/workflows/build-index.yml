name: build-index

# Regenerate api/index.json from per-skill frontmatter and commit any drift back
# to main. The registry is the canonical "what does USAP ship" artifact every
# external client (Claude Code, Cursor, Goose, OpenCode, search engines)
# fetches once instead of crawling the repo.
on:
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - 'agents/**/cs-*.md'
      - 'tools/build_index.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate api/index.json
        run: python3 tools/build_index.py

      # DRIFT GATE, not an auto-commit. `main` is a protected branch: bot
      # pushes are rejected, so a workflow that commits back can only ever
      # fail. It also contradicted regen-index.yml, which already gates on
      # this same drift. Generated artifacts are now a reviewed change.
      # Regenerate locally with:  python3 tools/build_index.py
      - name: api/index.json drift gate
        run: |
          if ! git diff --exit-code -- api/index.json; then
            echo "::error::api/index.json is out of date. Run 'python3 tools/build_index.py' and commit the result."
            exit 1
          fi
          echo "api/index.json is current"
