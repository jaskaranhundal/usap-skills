name: build-index

# Regenerate index.json from per-skill frontmatter and commit any drift back
# to main. The registry is the canonical "what does USAP ship" artifact every
# external client (Claude Code, Cursor, Goose, OpenCode, search engines)
# fetches once instead of crawling the repo.
on:
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - 'agents/**/cs-*.md'
      - 'tools/build_index.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate index.json
        run: python3 tools/build_index.py

      - name: Commit updated index.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "No index.json changes to commit"
          else
            SKILLS=$(python3 -c "import json; print(json.load(open('index.json'))['counts']['skills'])")
            git commit -m "chore(index): regenerate index.json ($SKILLS skills) [skip ci]"
            git push
          fi
