name: bundle-dist

on:
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - 'agents/**'
      - 'shared/scripts/bundle_usap.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bundle mode'
        required: false
        default: 'all'
        # type: choice constrains this to the four values below. Without it the
        # input is free text, and it is interpolated into a shell step — a
        # dispatcher could inject arbitrary commands onto the runner.
        type: choice
        options: [all, lite, pro, full]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Generate bundles
        # Defence in depth: the value reaches bash as an environment variable,
        # never as text pasted into the script body. Even if the choice
        # constraint above were removed, this step could not be injected.
        env:
          MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          if [ "$MODE" = "all" ]; then
            python3 shared/scripts/bundle_usap.py bundle --mode lite
            python3 shared/scripts/bundle_usap.py bundle --mode pro
            python3 shared/scripts/bundle_usap.py bundle --mode full
          else
            python3 shared/scripts/bundle_usap.py bundle --mode "$MODE"
          fi

      - name: Show bundle sizes
        run: |
          for f in dist/*.md; do
            [ -f "$f" ] && echo "$f: $(wc -c < $f) bytes"
          done

      # DRIFT GATE, not an auto-commit. `main` is a protected branch: bot
      # pushes are rejected, so committing back can only fail. It was already
      # failing before protection, on a concurrent-push race:
      #   "cannot lock ref 'refs/heads/main': is at X but expected Y"
      # Gating removes the race entirely. Regenerate locally with:
      #   python3 shared/scripts/bundle_usap.py bundle --mode lite|pro|full
      - name: dist/ drift gate
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Regenerate the bundles and commit the result."
            exit 1
          fi
          echo "dist/ is current"
