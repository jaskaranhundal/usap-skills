name: validate-skills

# Runs on every PR and every push to a branch. The validator is stdlib-only
# Python; no `pip install` is performed. Logic lives in tools/validate_skill.py
# and standards/frontmatter-spec.md (kept in sync — the validator's
# ALLOWED_CATEGORIES set is the spec's enum).
on:
  pull_request:
  # No paths: filter. These jobs are required status checks on main, and a
  # required check that is path-filtered never reports on a PR outside those
  # paths — the PR then waits on "Expected" forever and cannot merge. They
  # run in seconds, so running them on every PR is the cheaper trade.
  push:
    paths:
      - '**/SKILL.md'
      - '**/sample_output.json'
      - 'standards/**'
      - 'mappings/**'
      - 'tools/validate_skill.py'
      - 'tools/output_contract.py'
      - 'tools/framework_extractor.py'
      - 'tools/regen_samples.py'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate every active-domain SKILL.md
        run: |
          python3 tools/validate_skill.py --all --summary

      - name: Validate 11-field output contract across every committed sample
        # Blocking, STRUCTURAL ONLY. Every committed sample must satisfy the
        # 11-field structure. The hardest-line evidence gate (every verdict
        # must cite a resolvable source) is enforced at the runtime contract
        # boundary and rolled out across samples incrementally — see the
        # non-blocking "Evidence-gate rollout status" step below. Using
        # --structural-only here keeps the corpus gate green during rollout
        # without loosening the runtime gate.
        run: |
          set -eu
          rc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python3 tools/output_contract.py --structural-only "$f" || rc=1
          done < <(find appsec-devsecops cloud-infra detection governance \
                        identity-access pentest platform-ai red-team response \
                        risk-compliance system-security webapp-security \
                        -name sample_output.json -path '*/expected_outputs/*' 2>/dev/null)
          exit $rc

      - name: Evidence-gate rollout status (non-blocking)
        # Reports how many committed samples already satisfy the hardest-line
        # evidence gate (>=1 resolvable source: mcp:/https:/s3:/local://).
        # Non-blocking by design: samples are migrated skill-by-skill during
        # the connector-agnostic rollout. This step makes the remaining
        # backlog visible without failing the build.
        run: |
          set -u
          pass=0; fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if python3 tools/output_contract.py "$f" >/dev/null 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi
          done < <(find appsec-devsecops cloud-infra detection governance \
                        identity-access pentest platform-ai red-team response \
                        risk-compliance system-security webapp-security \
                        -name sample_output.json -path '*/expected_outputs/*' 2>/dev/null)
          echo "Evidence-gate rollout: ${pass} sample(s) resolvable-source-compliant, ${fail} still on the backlog." | tee -a "$GITHUB_STEP_SUMMARY" 2>/dev/null || \
            echo "Evidence-gate rollout: ${pass} compliant, ${fail} backlog."
          exit 0

      - name: Sample generator drift check
        # Re-runs tools/regen_samples.py in --check mode. Fails if the
        # generator would produce a different payload than what is committed
        # for any skill whose existing sample is NOT already a hand-authored
        # contract-conformant payload. Hand-authored faithful samples (like
        # appsec-devsecops/vuln-scan) are left alone by design.
        run: |
          python3 tools/regen_samples.py --check

      - name: Framework-mappings drift check
        # Regenerates mappings/* in-memory and fails if the committed files
        # differ from what the source-of-truth metadata.frameworks would
        # produce. Never hand-edit files under mappings/ except the
        # per-subdirectory README.md — the artifacts are always generated.
        run: |
          python3 tools/framework_extractor.py --check

      - name: Held-out eval engine self-check
        # Protects the scoring math in tests/holdout_runner.py. The synthetic
        # example encodes a deliberately-imperfect predictor whose metrics are
        # fixed (precision/recall 0.8571, FPR 0.20). If these move without a
        # corpus change, the engine regressed. Deterministic + offline.
        run: |
          out=$(python3 tests/holdout_runner.py --responder synthetic \
                  --predictions tests/holdout/example_predictions.json --label ci)
          echo "$out"
          echo "$out" | grep -q "precision    0.8571" \
            && echo "$out" | grep -q "FPR          0.2" \
            && echo "  PASS holdout eval engine self-check" \
            || { echo "  FAIL eval engine metrics changed"; exit 1; }


      # plugins/usap/ is a distributed COPY of content whose source of truth is
      # the repo root. 1.13.1 shipped five agent definitions taken from a branch
      # 60 commits behind main, each missing the usap_mcp whitelist and the
      # "never invoke a mutating capability autonomously" rule. The plugin loaded
      # cleanly and answered with the human-approval gate removed. This gate
      # makes that undetectable-by-eye failure a build failure.
      - name: Polyglot mirror drift gate
        # .codex/.gemini/.cursor/.windsurf/.aider are generated symlink trees plus
        # an index each (scripts/sync_all.py). They drifted by a whole skill
        # unnoticed until 1.14.0 because nothing gated them.
        run: python3 scripts/sync_all.py --check

      - name: Plugin mirror drift gate
        run: |
          python3 tools/sync_plugin.py --check

      - name: Validate invocation-control frontmatter (Claude Code extensions)
        # Strict — all 18 originally WARN'd skills were backfilled with explicit
        # metadata.usap_level + invocation-control fields; the validator now
        # blocks the build on any new WARN regression.
        run: |
          python3 tools/validate_invocation_control.py --all --strict --summary
      - name: Naming convention check (cs-* agents)
        run: |
          python3 - <<'PYEOF'
          import os, sys
          errors = []
          for root, _dirs, files in os.walk("agents"):
              for fname in files:
                  if not fname.endswith(".md"):
                      continue
                  if fname in ("CLAUDE.md", "README.md"):
                      continue
                  if not fname.startswith("cs-"):
                      errors.append(f"{os.path.join(root, fname)}: must use cs- prefix")
          if errors:
              for e in errors:
                  print(f"  FAIL {e}")
              sys.exit(1)
          print("  PASS Naming conventions OK")
          PYEOF
