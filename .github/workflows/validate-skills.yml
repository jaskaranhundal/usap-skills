name: validate-skills

# Runs on every PR and every push to a branch. The validator is stdlib-only
# Python; no `pip install` is performed. Logic lives in tools/validate_skill.py
# and standards/frontmatter-spec.md (kept in sync — the validator's
# ALLOWED_CATEGORIES set is the spec's enum).
on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/sample_output.json'
      - '**/output-template.json'
      - 'standards/**'
      - 'mappings/**'
      - 'tools/validate_skill.py'
      - 'tools/output_contract.py'
      - 'tools/framework_extractor.py'
      - 'tools/regen_samples.py'
      - '.github/workflows/validate-skills.yml'
  push:
    paths:
      - '**/SKILL.md'
      - '**/sample_output.json'
      - 'standards/**'
      - 'mappings/**'
      - 'tools/validate_skill.py'
      - 'tools/output_contract.py'
      - 'tools/framework_extractor.py'
      - 'tools/regen_samples.py'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate every active-domain SKILL.md
        run: |
          python3 tools/validate_skill.py --all --summary

      - name: Validate 11-field output contract across every committed sample
        # Blocking. The 59 stub samples from the original 71-skill seed have
        # been backfilled to contract-conformant payloads by
        # tools/regen_samples.py (see SELF-AUDIT.md). Any new sample that
        # fails the contract — or any regression on an existing one — now
        # fails the build.
        run: |
          set -eu
          rc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python3 tools/output_contract.py "$f" || rc=1
          done < <(find appsec-devsecops cloud-infra detection governance \
                        identity-access pentest platform-ai red-team response \
                        risk-compliance system-security webapp-security \
                        -name sample_output.json -path '*/expected_outputs/*' 2>/dev/null)
          exit $rc

      - name: Sample generator drift check
        # Re-runs tools/regen_samples.py in --check mode. Fails if the
        # generator would produce a different payload than what is committed
        # for any skill whose existing sample is NOT already a hand-authored
        # contract-conformant payload. Hand-authored faithful samples (like
        # appsec-devsecops/vuln-scan) are left alone by design.
        run: |
          python3 tools/regen_samples.py --check

      - name: Framework-mappings drift check
        # Regenerates mappings/* in-memory and fails if the committed files
        # differ from what the source-of-truth metadata.frameworks would
        # produce. Per gap-analysis anti-pattern 7.4 — never hand-edit
        # files under mappings/ except the per-subdirectory README.md.
        run: |
          python3 tools/framework_extractor.py --check


      - name: Validate invocation-control frontmatter (Claude Code extensions)
        # Strict — all 18 originally WARN'd skills were backfilled with explicit
        # metadata.usap_level + invocation-control fields; the validator now
        # blocks the build on any new WARN regression.
        run: |
          python3 tools/validate_invocation_control.py --all --strict --summary
      - name: Naming convention check (cs-* agents)
        run: |
          python3 - <<'PYEOF'
          import os, sys
          errors = []
          for root, _dirs, files in os.walk("agents"):
              for fname in files:
                  if not fname.endswith(".md"):
                      continue
                  if fname in ("CLAUDE.md", "README.md"):
                      continue
                  if not fname.startswith("cs-"):
                      errors.append(f"{os.path.join(root, fname)}: must use cs- prefix")
          if errors:
              for e in errors:
                  print(f"  FAIL {e}")
              sys.exit(1)
          print("  PASS Naming conventions OK")
          PYEOF
