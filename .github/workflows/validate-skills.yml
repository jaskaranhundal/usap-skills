name: validate-skills

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/output-template.json'
      - '**/sample_output.json'
      - 'standards/**'
      - 'agents/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'PYEOF'
          import os, yaml, re, sys

          REQUIRED_CANONICAL = {"name", "description", "license", "metadata"}
          REQUIRED_META      = {"version", "author", "category", "updated", "agent_slug"}
          ALLOWED_CATEGORIES = {
            "usap-detection", "usap-response", "usap-risk-compliance",
            "usap-cloud-infra", "usap-appsec-devsecops", "usap-identity-access",
            "usap-red-team", "usap-governance", "usap-platform-ai",
            "usap-system-security", "usap-pentest", "usap-engineering", "usap-platform",
            "usap-operations", "usap-adversary", "usap-devsecops", "usap-infrastructure",
            "usap-executive", "usap-control-plane", "usap-safety"
          }
          SKIP_DIRS = {
            "dist", "docs", "references", "assets", "expected_outputs", "scripts",
            "templates", "standards", "shared", "tests", "anythingllm-package"
          }
          errors = []

          for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if not d.startswith(".") and d not in SKIP_DIRS]
            if "SKILL.md" not in files:
              continue
            path = os.path.join(root, "SKILL.md")
            with open(path) as f:
              content = f.read()
            if not content.startswith("---"):
              errors.append(f"{path}: missing YAML frontmatter")
              continue
            try:
              parts = content.split("---", 2)
              fm = yaml.safe_load(parts[1])
            except Exception as e:
              errors.append(f"{path}: YAML parse error: {e}")
              continue

            missing = REQUIRED_CANONICAL - set(fm.keys())
            if missing:
              errors.append(f"{path}: missing top-level keys: {missing}")
              continue

            if isinstance(fm.get("metadata"), dict):
              missing_meta = REQUIRED_META - set(fm["metadata"].keys())
              if missing_meta:
                errors.append(f"{path}: missing metadata keys: {missing_meta}")
              cat = fm["metadata"].get("category", "")
              if cat not in ALLOWED_CATEGORIES:
                errors.append(f"{path}: invalid category '{cat}'")
              slug = fm.get("name", "")
              agent_slug = fm["metadata"].get("agent_slug", "").strip('"')
              if slug != agent_slug:
                errors.append(f"{path}: name '{slug}' != agent_slug '{agent_slug}'")

            slug = fm.get("name", "")
            if not re.match(r'^[a-z][a-z0-9-]+$', slug):
              errors.append(f"{path}: slug '{slug}' must be lowercase-hyphenated")
            if len(slug.split("-")) > 4:
              errors.append(f"{path}: slug '{slug}' exceeds 4-word limit")

          if errors:
            print("SKILL.md validation FAILED:")
            for e in errors:
              print(f"  FAIL {e}")
            sys.exit(1)
          else:
            count = sum(1 for r, d, f in os.walk(".") if "SKILL.md" in f)
            print(f"  PASS All {count} SKILL.md files passed validation")
          PYEOF

      - name: Validate output contract fields (changed files only)
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1 2>/dev/null || true
          git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > /tmp/changed.txt 2>/dev/null || true
          python3 - <<'PYEOF'
          import os, json, sys
          REQUIRED = {
            "agent_slug","intent_type","action","rationale","confidence",
            "severity","key_findings","evidence_references","next_agents",
            "human_approval_required","timestamp_utc"
          }
          VALID_INTENTS   = {"detect","respond","analyze","advise","escalate","report","block"}
          VALID_SEVERITIES = {"critical","high","medium","low","informational"}
          try:
            changed = [l.strip() for l in open("/tmp/changed.txt") if l.strip()]
          except FileNotFoundError:
            changed = []
          targets = [p for p in changed
                     if os.path.basename(p) in ("output-template.json","sample_output.json")
                     and os.path.exists(p)]
          errors = []
          for path in targets:
            try:
              with open(path) as f:
                data = json.load(f)
            except Exception as e:
              errors.append(f"{path}: {e}"); continue
            missing = REQUIRED - set(data.keys())
            if missing:
              errors.append(f"{path}: missing fields: {missing}")
            if data.get("intent_type") not in VALID_INTENTS:
              errors.append(f"{path}: invalid intent_type")
            if data.get("severity") not in VALID_SEVERITIES:
              errors.append(f"{path}: invalid severity")
          if errors:
            for e in errors: print(f"  FAIL {e}")
            sys.exit(1)
          else:
            print(f"  PASS Output contract validated on {len(targets)} changed file(s)")
          PYEOF

      - name: Check naming conventions
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          errors = []
          for root, dirs, files in os.walk("agents"):
            for fname in files:
              if fname.endswith(".md") and fname not in ("CLAUDE.md","README.md"):
                if not fname.startswith("cs-"):
                  errors.append(f"{os.path.join(root,fname)}: must use cs- prefix")
          if errors:
            for e in errors: print(f"  FAIL {e}")
            sys.exit(1)
          else:
            print("  PASS Naming conventions OK")
          PYEOF

      - name: Summary
        run: |
          SKILLS=$(find . -name "SKILL.md" -not -path "./.git/*" -not -path "./dist/*" -not -path "./templates/*" | wc -l)
          AGENTS=$(find ./agents -name "cs-*.md" 2>/dev/null | wc -l)
          echo "Skill packages     : $SKILLS"
          echo "Orchestrator agents: $AGENTS"
