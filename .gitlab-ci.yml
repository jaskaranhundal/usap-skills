# ─────────────────────────────────────────────────────────────
# GitLab CI for usap-skills — mirror of the GitHub Actions gates
# ─────────────────────────────────────────────────────────────
# This file exists so the repo is runnable on GitLab as well as GitHub.
#
# HONEST SCOPE NOTE, read this first:
# The canonical remote is GitHub. Until this repo is mirrored to a GitLab
# instance, THIS FILE NEVER EXECUTES. It is documentation of intent, not a
# control. Do not cite it as evidence that these gates run — the GitHub
# Actions workflows in .github/workflows/ are the gates that actually run today.
#
# Every job below was executed against this branch before being written here,
# and the result is recorded on the job. Jobs are blocking where they are
# green today — a gate that is already green costs nothing to enforce. Two
# jobs are advisory, each with a NAMED flip condition, because they are not
# green yet. Nothing here is advisory without a stated reason and exit test:
# a pipeline where everything is allow_failure forever is theater.
#
# BRANCH MODEL: two branches, `dev` -> `main`. The `test` branch was removed on
# 2026-08-14 (it held zero unique commits and was fully contained in `main`).
# `dev` is the integration branch and the last stop before `main`, so the full
# validate/test suite runs on both. `build:bundle` stays `main`-only — it
# produces a release artifact, not an integration check.
#
# TOOLING: written against `main`'s tooling as of the dev->main merge. The
# earlier dev/main interface drift is resolved — output_contract.py now has
# --structural-only, and tests/holdout_runner.py is present.
# ─────────────────────────────────────────────────────────────

stages:
  - validate
  - test
  - security
  - build

variables:
  PYTHON_IMAGE: "python:3.11-alpine"
  # Scanner images pinned by DIGEST, not tag. A tag is mutable: if the upstream
  # image is replaced under the same tag, a digest pin fails loud instead of
  # silently running someone else's scanner.
  # To refresh: pull the new tag, verify it scans clean, read the digest with
  #   docker image inspect <image>:<tag> --format '{{.RepoDigests}}'
  # then replace tag and digest together.
  GITLEAKS_IMAGE: "zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  SEMGREP_IMAGE: "semgrep/semgrep@sha256:3978a2b4e6c2cbd4eee04b0f05d5ca4a82e6526dc89e01a5dcbb941cedafb393"

workflow:
  rules:
    # Keep only the MR pipeline when an MR is open for the source branch.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  image: $PYTHON_IMAGE
  interruptible: true

# ─── validate ────────────────────────────────────────────────
# Mirrors .github/workflows/validate-skills.yml

validate:skills:
  # MEASURED 2026-08-14 on this branch: exit 0, 79 skills. BLOCKING.
  stage: validate
  script:
    - python3 tools/validate_skill.py --all --summary
  rules:
    - changes: ["**/SKILL.md", "tools/validate_skill.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

validate:contract:
  stage: validate
  # Mirrors .github/workflows/validate-skills.yml exactly. --structural-only is
  # the blocking corpus gate; the FULL evidence gate (every verdict must cite a
  # resolvable source) is being rolled out incrementally and is NOT blocking
  # here, for the same reason it is not blocking there — 74 of 77 samples still
  # fail it, and gating on that today would block every MR.
  # MEASURED on the merged tree 2026-08-14: structural 77/77 pass, exit 0.
  script:
    - |
      set -eu
      rc=0
      while IFS= read -r f; do
        [ -z "$f" ] && continue
        python3 tools/output_contract.py --structural-only "$f" || rc=1
      done < <(find appsec-devsecops cloud-infra detection governance \
                    identity-access pentest platform-ai red-team response \
                    risk-compliance system-security webapp-security \
                    -name sample_output.json -path '*/expected_outputs/*' 2>/dev/null)
      exit $rc
  rules:
    - changes: ["**/expected_outputs/sample_output.json", "tools/output_contract.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

validate:plugin-mirror:
  # plugins/usap/ is a distributed copy; the root is the source of truth. See
  # tools/sync_plugin.py for why this gate exists (1.13.1 shipped five agent
  # definitions with the human-approval gate silently missing).
  # MEASURED 2026-08-14: exit 0, mirrors 41 source files, no drift. BLOCKING.
  stage: validate
  script:
    - python3 tools/sync_plugin.py --check
  rules:
    - changes: ["agents/**/*", "plugins/usap/**/*", "tools/sync_plugin.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

validate:invocation:
  # MEASURED on the merged tree 2026-08-14: 80 total, 79 OK, 1 WARN, 0 FAIL,
  # exit 1. --strict treats WARN as failure. The single WARN is
  # cloud-infra/container-image-scan and it PRE-DATES this pipeline — main's own
  # validate-skills workflow blocks on it too and is currently red.
  # Kept BLOCKING deliberately: main blocks on it, and making it advisory here
  # would be softer than the GitHub gate it mirrors, which would hide a real
  # regression. Fixing that one WARN turns this green.
  stage: validate
  script:
    - python3 tools/validate_invocation_control.py --all --strict --summary
  rules:
    - changes: ["**/SKILL.md", "tools/validate_invocation_control.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

# ─── test ────────────────────────────────────────────────────

test:tools:
  stage: test
  # Executes every *_tool.py and asserts the output contract.
  #
  # Exit-code contract, important: stub tools deliberately exit 3 with
  # "status": "not_implemented" (see issue #120, and #126 for why 3 and not 2).
  # That is the CORRECT behaviour — a tool that scanned nothing must never look
  # like a pass. This job treats exit 3 + not_implemented as EXPECTED.
  #
  # Exit 2 is NOT expected and fails the job: argparse returns 2 on a usage
  # error, so a 2 here means the tool was invoked wrongly (a missing required
  # --input, say), which is a defect in this job or in the tool's interface —
  # never a declared stub. Keeping 2 and 3 distinct is the whole point of #126.
  #
  # MEASURED 2026-08-14: tools=78 implemented=12 declared-stub=66 errors=0.
  # FLIPPED TO BLOCKING. It was advisory pending #129
  # (governance/security-debt-tracker crashed on empty stdin); that is fixed,
  # the stated flip condition (errors=0) is met, so the gate is now enforced.
  script:
    - |
      python3 - <<'PY'
      import json, os, subprocess, sys, tempfile
      REQUIRED = ["agent_slug","intent_type","action","rationale","confidence",
                  "severity","key_findings","evidence_references","next_agents",
                  "human_approval_required","timestamp_utc"]
      INTENTS = {"detect","respond","analyze","advise","escalate","report","block"}
      SEVERITIES = {"critical","high","medium","low","informational"}
      tools = []
      for dp, dn, fn in os.walk("."):
          # plugins/ holds a verified mirror of these same scripts. Walking it
          # would re-test byte-identical copies and inflate the counts; the
          # mirror's integrity is validate:plugin-mirror's job, not this one.
          if "/.git" in dp or dp.startswith("./references") or dp.startswith("./plugins"):
              continue
          tools += [os.path.join(dp, f) for f in fn if f.endswith("_tool.py")]
      impl = stub = 0
      errors = []
      # Some tools legitimately require --input. Retry those once with a
      # minimal valid file rather than reporting a usage error as a defect.
      probe = os.path.join(tempfile.mkdtemp(), "probe.md")
      with open(probe, "w") as fh:
          fh.write("# probe\nA short design note used to smoke-test tools that require --input.\n")
      for t in sorted(tools):
          r = subprocess.run([sys.executable, t, "--output", "json"],
                             capture_output=True, text=True, timeout=60)
          if r.returncode == 2 and "--input" in (r.stderr or ""):
              r = subprocess.run([sys.executable, t, "--input", probe, "--output", "json"],
                                 capture_output=True, text=True, timeout=60)
          if r.returncode == 2:
              errors.append(f"{t}: exit 2 (argparse usage error) - wrong invocation, "
                            f"not a declared stub: {r.stderr.strip().splitlines()[-1] if r.stderr.strip() else ''}")
              continue
          if r.returncode not in (0, 3):
              errors.append(f"{t}: unexpected exit {r.returncode}")
              continue
          try:
              d = json.loads(r.stdout)
          except Exception as e:
              errors.append(f"{t}: unparseable JSON ({e})")
              continue
          # Contract fields are required of implemented tools. Stubs that
          # correctly declare themselves are counted, not failed.
          if r.returncode == 3 or d.get("status") == "not_implemented":
              stub += 1
              if d.get("status") != "not_implemented":
                  errors.append(f"{t}: exit 3 but status != not_implemented")
              continue
          impl += 1
          for f in REQUIRED:
              if f not in d:
                  errors.append(f"{t}: missing '{f}'")
          if d.get("intent_type") not in INTENTS:
              errors.append(f"{t}: invalid intent_type")
          if d.get("severity") not in SEVERITIES:
              errors.append(f"{t}: invalid severity")
      print(f"tools={len(tools)} implemented={impl} declared-stub={stub} errors={len(errors)}")
      for e in errors[:40]:
          print("  FAIL", e)
      sys.exit(1 if errors else 0)
      PY
  rules:
    - changes: ["**/scripts/*_tool.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

test:fixtures:
  # Implemented tools against their recorded fixtures (tests/fixtures/manifest.json).
  # Exit code and full output contract are both checked. BLOCKING.
  stage: test
  script:
    - python3 tests/run_fixtures.py
  rules:
    - changes: ["**/scripts/*_tool.py", "tests/fixtures/**", "tests/run_fixtures.py", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

test:determinism:
  # MEASURED 2026-08-14 on this branch: regen_samples 79 clean,
  # framework_extractor 3 artifacts match. Both exit 0. BLOCKING.
  stage: test
  # Committed artifacts must match what the generators produce. Catches a
  # hand-edited mapping or sample that no longer matches its source.
  script:
    - python3 tools/regen_samples.py --check
    - python3 tools/framework_extractor.py --check
  rules:
    - changes: ["**/SKILL.md", "**/expected_outputs/sample_output.json", "mappings/**/*", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

test:eval:
  # Protects the scoring math in tests/holdout_runner.py. The synthetic example
  # encodes a deliberately-imperfect predictor whose metrics are fixed
  # (precision/recall 0.8571, FPR 0.20). If these move without a corpus change,
  # the engine regressed. Deterministic and offline.
  # MEASURED on the merged tree 2026-08-14: exit 0, precision 0.8571, FPR 0.2.
  stage: test
  script:
    - |
      out=$(python3 tests/holdout_runner.py --responder synthetic \
              --predictions tests/holdout/example_predictions.json --label ci)
      echo "$out"
      echo "$out" | grep -q "precision    0.8571" \
        && echo "$out" | grep -q "FPR          0.2" \
        && echo "  PASS holdout eval engine self-check" \
        || { echo "  FAIL eval engine metrics changed"; exit 1; }
  rules:
    - changes: ["tests/**/*", "tools/**/*", ".gitlab-ci.yml"]
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main)$/'

# ─── security ────────────────────────────────────────────────

security:secrets:
  # NOT MEASURED: gitleaks image not pulled locally. Expected to find
  # historical findings on first run — see the baseline note below.
  stage: security
  # The highest real risk in this repo: it is PUBLIC and has never been
  # secret-scanned. Full history, not just the working tree — a secret removed
  # in a later commit is still published.
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose --exit-code 1
  # No baseline file is committed. If this fails on first run, triage the
  # findings, rotate anything real, and only then add a REDACTED
  # .gitleaks-baseline.json for confirmed historical false positives.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

security:sast:
  stage: security
  image:
    name: $SEMGREP_IMAGE
    entrypoint: [""]
  script:
    - semgrep --config p/python --error --skip-unknown-extensions .
  # ADVISORY on purpose — the second of two, alongside test:tools.
  # Semgrep has never run on this repo, so its false-positive rate is unknown.
  # Not measured on this branch: the pinned image was not pulled locally.
  # FLIP CONDITION: set allow_failure to false once two consecutive weeks of
  # pipelines are green, or once findings are triaged to zero. Track the flip —
  # an advisory job that stays advisory forever teaches the team to ignore it.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ─── build ───────────────────────────────────────────────────

build:bundle:
  stage: build
  script:
    - python3 shared/scripts/bundle_usap.py bundle --mode lite
    - python3 shared/scripts/bundle_usap.py bundle --mode pro
    - python3 shared/scripts/bundle_usap.py bundle --mode full
    # SHA256 manifest over the produced bundles. This is a tamper-evidence
    # record, NOT a signature — see the provenance note below.
    - |
      if [ -d dist ]; then
        (cd dist && sha256sum *.md > SHA256SUMS) && cat dist/SHA256SUMS
      fi
  artifacts:
    paths: ["dist/"]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ─────────────────────────────────────────────────────────────
# PROVENANCE — the real gap, deliberately NOT solved by a job here
# ─────────────────────────────────────────────────────────────
# A design review of this pipeline flagged artifact signing as a Critical gap,
# on the standard reasoning that consumers install and execute this content.
# The reasoning is right; the usual remedy is not. bundle-dist.yml writes
# dist/*.md and COMMITS THEM BACK to the repo — the artifact is git-tracked
# text, so cosign over it duplicates what git already content-addresses.
#
# The control that actually applies is upstream of CI and cannot be enforced
# by a CI job:
#   1. `main` has NO branch protection (API returns 404) — no required reviews,
#      no required checks, admins unrestricted. Anyone with write access can
#      push directly to the branch users install from.
#   2. No commit in recent history carries a verified signature.
#
# Fix those two in repository settings. A pipeline cannot gate the branch it
# runs on; claiming otherwise would be exactly the theater this file warns about.
# ─────────────────────────────────────────────────────────────
